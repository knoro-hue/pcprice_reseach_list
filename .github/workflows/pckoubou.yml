name: パソコン工房 PC価格一覧

on:
  workflow_dispatch:          # Actions画面の「Run workflow」ボタンで手動実行
  schedule:
    - cron: "17 0 * * *"      # 毎日 9:17 JST（UTC 0:17）。不要ならこの2行を削除

permissions:
  contents: write             # 最新版Excelをリポジトリに保存するため

concurrency:
  group: pckoubou
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存ライブラリ
        run: pip install openpyxl==3.1.5

      - name: 取得してExcel出力
        run: python pckoubou_list.py --out output

      - name: 日付付きExcelをダウンロード用に保存（30日間）
        uses: actions/upload-artifact@v4
        with:
          name: pckoubou-pc-${{ github.run_number }}
          path: output/pckoubou_pc_2*.xlsx
          retention-days: 30

      - name: 最新版をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pckoubou_pc_latest.xlsx
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "パソコン工房 PC価格一覧 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
