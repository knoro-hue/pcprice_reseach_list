name: Cloudflare Pages へ公開

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["PC価格調査（3社）"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 設定チェック
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare のシークレット未設定のためスキップ"; echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != '1'
        with:
          ref: main
      - name: サイトを組み立て（社内用／お客様用）
        if: steps.cfg.outputs.skip != '1'
        run: python3 scripts/build_sites.py
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != '1'
        with:
          node-version: "20"
      - name: Cloudflare Pages にデプロイ
        if: steps.cfg.outputs.skip != '1'
        run: |
          for p in pcprice-internal pcprice-public; do
            npx --yes wrangler@3 pages project create "$p" --production-branch main >/dev/null 2>&1 || true
          done
          npx --yes wrangler@3 pages deploy site/internal --project-name pcprice-internal --branch main --commit-dirty=true
          npx --yes wrangler@3 pages deploy site/public --project-name pcprice-public --branch main --commit-dirty=true
